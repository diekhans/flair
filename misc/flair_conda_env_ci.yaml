name: flair_conda_env
channels:
  - conda-forge
  - bioconda
  - conda

# python as pyproject.toml requires, or pip install -e . fails
dependencies:
  - python >=3.13,<3.15
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pysam >=0.24.1,<0.25.0
  - pipettor >=1.2.1
  # bedToBigBed writes transcriptome's .bb output; intron-prospector is used by
  # flair fusion and the junction tests; make test-base runs both
  - ucsc-bedtobigbed
  - intron-prospector >=1.5
  # longshot calls the variants the isoalleles test inputs are phased from; whatshap is
  # not needed, as FLAIR does not run it and its isoalleles output is committed under
  # test/input
  - longshot >=1.0
  - pip
  - pip:
      - matplotlib>=3.10.0,<4.0.0
