name: flair-dev

channels:
  - bioconda
  - conda-forge

# python as pyproject.toml requires.  The --help test comparisons need 3.13 or
# later: argparse changed its help layout there and the expected files are in the
# new form
dependencies:
  - python >=3.13,<3.15
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pysam >=0.24.1,<0.25.0
  # longshot calls the variants the isoalleles test inputs are phased from.  whatshap
  # is not here: FLAIR does not run it, bioconda builds it through python 3.13, which
  # would hold every environment built from this file at that version, and its
  # isoalleles output is committed under test/input.  `make -C test
  # regen-isoalleles-inputs' needs it; install it on its own, see
  # docs/source/installing.rst
  - longshot >=1.0
  - intron-prospector >=1.5
  - ucsc-bedtobigbed
  - ucsc-hubcheck
  - pipettor >=1.2.1
  - poetry
  - sphinx
  - sphinx_rtd_theme
  - sphinx-argparse
  - pip
  - r-argparse
  - r-ggplot2
  - r-qqman
  - r-lazyeval
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-drimseq
  - bioconductor-stager
  - bioconductor-apeglm
