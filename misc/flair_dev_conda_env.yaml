name: flair-dev

channels:
  - bioconda
  - conda-forge

# python 3.12: the --help test expectations are in the pre-3.13 argparse
# format, and pysam <0.24 has no wheel for 3.14
dependencies:
  - python =3.12
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - longshot >=1.0
  - poetry
  - sphinx
  - sphinx_rtd_theme
  - sphinx-argparse
  - pip
  - r-argparse
  - r-ggplot2
  - r-qqman
  - r-lazyeval
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-drimseq
  - bioconductor-stager
  - bioconductor-apeglm
  - pip:
      - matplotlib>=3.10.0,<4.0.0
