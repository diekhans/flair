name: flair_conda_env
channels:
  - conda-forge
  - bioconda
  - conda

dependencies:
  - python >=3.13,<3.15
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  # flair's own range, so that conda does not pick a newer pysam than flair accepts
  - pysam >=0.24.1,<0.25.0
  - intron-prospector >=1.5
  - ucsc-bedtobigbed
  # longshot calls the variants the isoalleles test inputs are phased from.  whatshap,
  # which phases them and haplotags reads before flair isoalleles, is not here: FLAIR
  # does not run it, and bioconda builds it through python 3.13, which would hold this
  # whole environment at that version.  Install it on its own when you need it, see
  # docs/source/installing.rst
  - longshot >=1.0
  - pip
  # R dependencies of flair diffexp and diffsplice
  - r-argparse
  - r-ggplot2
  - r-qqman
  - r-lazyeval
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-drimseq
  - bioconductor-stager
  - bioconductor-apeglm
  - pip:
      - flair-brookslab==v3.0.0+dev
      - matplotlib>=3.11.2,<4.0.0
