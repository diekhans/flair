name: flair_conda_env
channels:
  - conda-forge
  - bioconda
  - conda

# python 3.12: the --help test expectations are in the pre-3.13 argparse
# format, and pysam <0.24 has no wheel for 3.14
dependencies:
  - python =3.12
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pip
  - pip:
      - flair-brookslab==v3.0.1+master
      - matplotlib>=3.10.0,<4.0.0
